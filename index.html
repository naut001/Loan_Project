<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ trả nợ</title>
<meta name="description" content="Theo dõi khoản nợ, hạn trả và sao kê, tiền người khác nợ bạn, tính khoản vay và lập kế hoạch dòng tiền.">
<meta name="theme-color" content="#15302A">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<!-- build:remove-start -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- build:remove-end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="v-login" hidden></div>

<div id="app-shell">
<div class="wrap">
  <header class="top">
    <div class="brand">Sổ trả nợ</div>
    <div class="top-r">
      <div class="sync" id="sync"><i></i><span>Đang tải…</span></div>
      <button type="button" class="btn sm ghost" id="acct-btn" data-act="account" hidden>Tài khoản</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Các mục">
    <button role="tab" data-tab="home" aria-selected="true">Tổng quan</button>
    <button role="tab" data-tab="debts" aria-selected="false">Khoản nợ</button>
    <button role="tab" data-tab="calc" aria-selected="false">Tính khoản vay</button>
    <button role="tab" data-tab="recv" aria-selected="false">Phải thu</button>
    <button role="tab" data-tab="plan" aria-selected="false">Kế hoạch</button>
    <button role="tab" data-tab="fund" aria-selected="false">Quỹ dự phòng</button>
  </nav>

  <main>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-debts"></section>
    <section class="view" id="v-calc"></section>
    <section class="view" id="v-recv"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-fund"></section>
  </main>
</div>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:16px">Ứng dụng cần bật JavaScript để chạy.</p></noscript>

<script src="js/util.js"></script>
<script src="js/loan.js"></script>
<script src="js/model.js"></script>
<script src="js/state.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/debts.js"></script>
<script src="js/views/calc.js"></script>
<script src="js/views/recv.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/fund.js"></script>
<script src="js/views/backup.js"></script>
<script src="js/events.js"></script>
<script src="js/supabase-sync.js"></script>
<script src="js/auth.js"></script>
<script src="js/views/login.js"></script>
<script src="js/app.js"></script>
<!-- build:remove-start -->
<script src="js/pwa.js"></script>
<!-- build:remove-end -->
</body>
</html>
